services:
  # ---------------------------------------------
  # FRONTEND: Vue 3 + Tailwind
  # ---------------------------------------------
  frontend:
    build:
      context: frontend-code
      dockerfile: ../infrastructure/docker/frontend-dev/dockerfile
    container_name: frontend-lostfinder
    ports:
      - "5173:5173"
    volumes:
    - ./frontend-code:/app          
    - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true 
    networks:
      - dev-network
    depends_on:
      - backend

  # ---------------------------------------------
  # BACKEND: Python API (DDD)
  # ---------------------------------------------
  backend:
    build:
      context: backend-code
      dockerfile: ../infrastructure/docker/backend-dev/dockerfile
    container_name: backend-lostfinder
    ports:
      - "5000:5000"
    volumes:
      - ./backend-code:/app
    environment:
      - FLASK_APP=app.py
      - USERNAME=findit_user
      - PORT=5432
      - HOSTNAME=db
      - SGBD=postgresql
      - JWT_SECRET=sua_chave_secreta_aqui
      - PASSWORD=findit_pass
      - DATABASE=findit_db
    networks:
      - dev-network
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------
  # BANCO DE DADOS: PostgreSQL
  # ---------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: database-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: findit_user
      POSTGRES_PASSWORD: findit_pass
      POSTGRES_DB: findit_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-code/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findit_user -d findit_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  # ---------------------------------------------
  # STACK OBSERVABILIDADE: loki, grafana e prometheus
  # ---------------------------------------------

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - dev-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - dev-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - loki
      - prometheus
    networks:
      - dev-network

volumes:
  postgres_data:

networks:
  dev-network:
    driver: bridge