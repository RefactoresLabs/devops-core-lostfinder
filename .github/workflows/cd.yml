name: CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone backend repo into backend-code
        working-directory: backend-code
        run: |
          rm -rf * .* 2>/dev/null || true
          git clone --branch main --single-branch https://github.com/RefactoresLabs/backend-lostfinder.git .

      - name: Clone frontend repo into frontend-code
        working-directory: frontend-code
        run: |
          rm -rf * .* 2>/dev/null || true
          git clone --branch main --single-branch https://github.com/RefactoresLabs/frontend-lostfinder.git .

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/backend-lostfinder:latest ./backend-code

      - name: Build frontend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-lostfinder:latest ./frontend-code

      - name: Push backend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/backend-lostfinder:latest

      - name: Push frontend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend-lostfinder:latest
