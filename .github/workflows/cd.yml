name: CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend
        run: docker build -t seuuser/backend ./backend-code

      - name: Build frontend
        run: docker build -t seuuser/frontend ./frontend-code

      - name: Push backend
        run: docker push seuuser/backend

      - name: Push frontend
        run: docker push seuuser/frontend