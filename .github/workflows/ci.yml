name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-code

    steps:
      - name: Clone backend repo
        run: git clone https://github.com/RefactoresLabs/backend-lostfinder.git backend-code

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-code   

    steps:
      - name: Clone frontend repo
        run: git clone https://github.com/RefactoresLabs/frontend-lostfinder.git frontend-code

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test

      - name: Build app
        run: npm run build
